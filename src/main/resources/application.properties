spring.profiles.active=dev

spring.jackson.time-zone=America/Lima
logging.pattern.dateformat=yyyy/MM/dd hh:mm:ss a

app.upload-dir=uploads
app.max-file-size=10MB

app.album.title.max-length=200

# CORS: orígenes (frontend) permitidos. Lista separada por comas; configurable sin recompilar
# (también vía variable de entorno APP_CORS_ALLOWED_ORIGINS). Ajustar el dominio de producción
# al dominio real donde se sirve el frontend.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,https://euphony.devbyjose.org

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB